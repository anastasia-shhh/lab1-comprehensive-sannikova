name: QA Linter

# Пайплайн запускается только при создании PR в ветку develop
on:
  pull_request:
    branches:
      - develop

jobs:
  flake8-lint:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Устанавливаем Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Укажите версию Python вашего проекта

      # 3. Устанавливаем flake8
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      # 4. Запускаем проверку кода
      - name: Run flake8
        run: flake8 .
